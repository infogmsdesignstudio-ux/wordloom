<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="pratoBase" cx="50%" cy="46%" r="75%">
      <stop offset="0%" stop-color="#8fd66a"/>
      <stop offset="55%" stop-color="#5fb84a"/>
      <stop offset="100%" stop-color="#3c8f39"/>
    </radialGradient>
    <linearGradient id="montagna1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9c8264"/>
      <stop offset="100%" stop-color="#5c4a38"/>
    </linearGradient>
    <linearGradient id="montagna2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b39a78"/>
      <stop offset="100%" stop-color="#77604a"/>
    </linearGradient>
    <radialGradient id="vignettaPrato" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="72%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0c1a08" stop-opacity="0.42"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#pratoBase)"/>

  <!-- sentiero sterrato, sullo sfondo, curvo -->
  <path d="M -20 460 C 300 500, 650 420, 900 470 S 1350 520, 1650 470"
        fill="none" stroke="#b79a68" stroke-width="26" opacity="0.4"/>
  <path d="M -20 460 C 300 500, 650 420, 900 470 S 1350 520, 1650 470"
        fill="none" stroke="#c9ad7c" stroke-width="10" opacity="0.35"/>

  <!-- ammassi montuosi, vista dall'alto: raggruppati sui bordi, centro sgombro per le zone di gioco -->
  <g opacity="0.94">
    <!-- angolo alto-sinistra -->
    <ellipse cx="150" cy="85" rx="160" ry="100" fill="url(#montagna2)"/>
    <ellipse cx="70" cy="55" rx="90" ry="60" fill="url(#montagna1)"/>
    <ellipse cx="250" cy="60" rx="85" ry="55" fill="url(#montagna1)"/>
    <ellipse cx="150" cy="55" rx="45" ry="24" fill="#e7dcc4" opacity="0.55"/>

    <!-- angolo alto-destra -->
    <ellipse cx="1460" cy="80" rx="165" ry="100" fill="url(#montagna2)"/>
    <ellipse cx="1540" cy="55" rx="90" ry="58" fill="url(#montagna1)"/>
    <ellipse cx="1390" cy="60" rx="80" ry="52" fill="url(#montagna1)"/>
    <ellipse cx="1460" cy="55" rx="42" ry="22" fill="#e7dcc4" opacity="0.55"/>

    <!-- angolo basso-sinistra -->
    <ellipse cx="120" cy="835" rx="175" ry="100" fill="url(#montagna2)"/>
    <ellipse cx="35" cy="865" rx="85" ry="55" fill="url(#montagna1)"/>
    <ellipse cx="220" cy="858" rx="80" ry="50" fill="url(#montagna1)"/>

    <!-- angolo basso-destra -->
    <ellipse cx="1480" cy="840" rx="175" ry="105" fill="url(#montagna2)"/>
    <ellipse cx="1565" cy="868" rx="85" ry="55" fill="url(#montagna1)"/>
    <ellipse cx="1380" cy="858" rx="75" ry="48" fill="url(#montagna1)"/>

    <!-- piccole colline lungo i bordi laterali, centro sgombro -->
    <ellipse cx="20" cy="450" rx="55" ry="90" fill="url(#montagna1)" opacity="0.85"/>
    <ellipse cx="1580" cy="470" rx="55" ry="95" fill="url(#montagna1)" opacity="0.85"/>
  </g>

  <!-- ciuffi d'erba/cespugli sparsi, tenui al centro per non disturbare la lettura delle carte -->
  <g fill="#2f7a34" opacity="0.5">
    <circle cx="310" cy="190" r="10"/>
    <circle cx="330" cy="205" r="7"/>
    <circle cx="470" cy="300" r="9"/>
    <circle cx="1050" cy="210" r="10"/>
    <circle cx="1180" cy="330" r="8"/>
    <circle cx="400" cy="680" r="9"/>
    <circle cx="760" cy="740" r="10"/>
    <circle cx="1080" cy="700" r="9"/>
    <circle cx="1250" cy="640" r="8"/>
    <circle cx="640" cy="480" r="6"/>
    <circle cx="980" cy="480" r="6"/>
  </g>
  <g fill="#a8e878" opacity="0.35">
    <circle cx="305" cy="185" r="4"/>
    <circle cx="1045" cy="205" r="4"/>
    <circle cx="755" cy="735" r="4"/>
  </g>

  <rect width="1600" height="900" fill="url(#vignettaPrato)"/>
</svg>
